name: CFA4 SDK checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  RUFF_VERSION: "0.17.3"
  ZIZMOR_VERSION: "1.32.0"
  ACTIONLINT_PY_VERSION: "1.7.12.25"

jobs:
  schemas:
    name: Schemas, examples and licence headers
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r tests/requirements.txt
      - name: Schema tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Python SDK installs without dependencies
        run: |
          .venv/bin/python -m pip install --quiet ./python
          .venv/bin/python -I -c "import cfa4_ai; print(cfa4_ai.PROTOCOL_VERSION)"
      - name: Licence headers
        run: bash scripts/check-licence.sh

  rust:
    name: Rust SDK (fmt, clippy, tests, licences)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Install cargo-deny (checksum-verified release binary)
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${name}.tar.gz" | sha256sum -c -
          tar xzf "${name}.tar.gz"
          install -m 0755 "${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Dependency licences, sources and bans (workers under any licence link this SDK)
        run: cargo deny check licenses sources bans
      - name: Security advisories (RustSec)
        run: cargo deny check advisories

  lint:
    name: Python lint and workflow security (Ruff, actionlint, zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install linters
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet "ruff==${RUFF_VERSION}" "zizmor==${ZIZMOR_VERSION}" "actionlint-py==${ACTIONLINT_PY_VERSION}"
      - name: ruff check
        run: .venv/bin/ruff check --output-format=github python tests
      - name: ruff format --check
        run: .venv/bin/ruff format --check python tests
      - name: actionlint
        run: .venv/bin/actionlint
      - name: zizmor
        run: .venv/bin/zizmor --offline --format=github .github
